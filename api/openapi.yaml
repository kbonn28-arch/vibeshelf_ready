openapi: 3.0.0
info:
  title: VibeShelf API
  version: 1.0.0
  description: Local API for VibeShelf connected to Supabase.

servers:
  - url: http://localhost:3000

paths:
  /books:
    get:
      summary: Get all books
      responses:
        "200":
          description: List of books

  /moods:
    get:
      summary: Get all moods
      responses:
        "200":
          description: List of moods

  /reviews:
    get:
      summary: Get all reviews
      responses:
        "200":
          description: List of reviews

    post:
      summary: Create a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - book_id
                - star_rating
                - review_text
              properties:
                user_id:
                  type: string
                book_id:
                  type: string
                star_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                review_text:
                  type: string
      responses:
        "201":
          description: Review created
        "400":
          description: Invalid request
